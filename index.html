<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Rugby With Friends — Irish rugby fixtures, kick-off times, and pub watchability. Six Nations, Rugby World Cup, URC, European Champions Cup, Challenge Cup, and all Irish teams.">
<meta name="theme-color" content="#16722e">
<title>Rugby With Friends — Irish Rugby</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #222; padding: 40px 20px; text-align: center; }
  h1 { color: #16722e; font-size: 28px; margin-bottom: 8px; }
  p { color: #666; font-size: 15px; margin: 6px 0; }
  .loader { margin: 20px auto; width: 32px; height: 32px; border: 3px solid #e8f0e8; border-top-color: #16722e; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #16722e; }
</style>
</head>
<body>
<h1>🏉 Rugby With Friends</h1>
<p>Loading the app…</p>
<div class="loader"></div>
<p>If nothing happens, <a href="/www/index.html">open the app directly</a>.</p>
<script>
  // Load the real app from /www/ into an iframe so the root URL serves a real page
  // (GitHub Pages serves from /, and /www/index.html is the SPA)
  try {
    var iframe = document.createElement('iframe');
    iframe.style.position = 'absolute';
    iframe.style.top = '0'; iframe.style.left = '0';
    iframe.style.width = '100%'; iframe.style.height = '100%';
    iframe.style.border = '0';
    iframe.style.background = '#f8f9fa';
    iframe.src = '/www/index.html';
    document.body.appendChild(iframe);
    // Also try a direct load as primary — the iframe is a fallback
    window.location.href = '/www/index.html';
  } catch(e) {
    document.querySelector('p').textContent = 'Loading…';
  }
</script>
</body>
</html>
